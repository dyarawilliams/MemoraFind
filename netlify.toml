[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/.netlify/functions/renderIndex"
  status = 200

[[redirects]]
  from = "/search/:cemetery"
  to = "/.netlify/functions/renderSearch"
  status = 200
  force = true
  [redirects.query]
    cemetery = ":cemetery"

# [[redirects]]
#   from = "/search"
#   to = "/.netlify/functions/search"
#   status = 200

[functions]
  included_files = ["public/views/**"]
