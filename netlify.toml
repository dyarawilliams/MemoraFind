[build]
  publish = "public"
  functions = "netlify/functions"

# The public address on /contact is the same value as ADMIN_EMAIL. Omit that
# key from secrets scanning so the address can stay in the page. Scanning
# itself stays on; this does not disable it. Add further keys with a comma.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL"

[[redirects]]
  from = "/"
  to = "/.netlify/functions/renderIndex"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/.netlify/functions/renderContact"
  status = 200

[[redirects]]
  from = "/search/update"
  to = "/.netlify/functions/getUpdateRecord"
  status = 200
# One person's record page: /grave/<record ID>. It uses its own /grave/ prefix
# because the /search/:cemetery rule below is force = true and would swallow
# any /search/... address. The splat also matches /grave/ itself, so an address
# with no record ID reaches the function and gets its own 404 page.
[[redirects]]
  from = "/grave/*"
  to = "/.netlify/functions/renderGrave"
  status = 200

[[redirects]]
  from = "/search/:cemetery"
  to = "/.netlify/functions/renderSearch"
  status = 200
  force = true

[functions]
  included_files = ["public/views/**"]
